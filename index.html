<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A high-precision PWA for real-time text analysis.">
    <meta name="theme-color" content="#333333">
    <title>Exact Word Counter</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
    <style>
        :root {
            --background-color: #f8f9fa;
            --card-background-color: #ffffff;
            --text-color: #212529;
            --primary-color: #007bff;
            --border-color: #dee2e6;
            --stat-label-color: #6c757d;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .dark-mode {
            --background-color: #212529;
            --card-background-color: #343a40;
            --text-color: #f8f9fa;
            --primary-color: #66b2ff;
            --border-color: #495057;
            --stat-label-color: #adb5bd;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background-color: var(--card-background-color);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 2rem;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        header h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 2rem;
        }

        #text-input {
            width: 100%;
            height: 200px;
            padding: 1rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 1.5rem;
        }

        .controls-section {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .control-group fieldset {
            border: none;
            padding: 0;
            margin: 0;
        }

        .control-group legend {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .radio-group, .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .radio-group input, .checkbox-group input {
            margin-right: 0.5rem;
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            display: block;
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stat-label {
            color: var(--stat-label-color);
        }

        .frequency-section h2 {
            text-align: center;
            margin-bottom: 1rem;
        }

        #frequency-list {
            padding-left: 2rem;
        }

        #frequency-list li {
            margin-bottom: 0.5rem;
        }

        .action-buttons {
            text-align: center;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 0.5rem 1rem;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <h1>Exact Word Counter</h1>
        </header>

        <section class="input-section">
            <label for="text-input" class="sr-only">Text Input</label>
            <textarea id="text-input" placeholder="Start typing, or paste your text here..."></textarea>
        </section>

        <section class="controls-section">
            <div class="control-group">
                <fieldset>
                    <legend>Mode</legend>
                    <div class="radio-group">
                        <input type="radio" id="smart-mode" name="mode" value="smart" checked>
                        <label for="smart-mode">Smart Mode</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="strict-mode" name="mode" value="strict">
                        <label for="strict-mode">Strict Mode</label>
                    </div>
                </fieldset>
            </div>
            <div class="control-group">
                <fieldset>
                    <legend>Configuration</legend>
                     <div class="checkbox-group">
                        <input type="checkbox" id="count-numbers" checked>
                        <label for="count-numbers">Count numbers</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="hyphenated-words" checked>
                        <label for="hyphenated-words">Treat hyphenated terms as one word</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="show-reading-time" checked>
                        <label for="show-reading-time">Show reading time</label>
                    </div>
                </fieldset>
            </div>
            <div class="control-group">
                <fieldset>
                    <legend>Appearance</legend>
                    <div class="checkbox-group">
                        <input type="checkbox" id="dark-mode-toggle">
                        <label for="dark-mode-toggle">Dark mode</label>
                    </div>
                </fieldset>
            </div>
        </section>

        <section class="stats-section">
            <div class="stat-item">
                <span class="stat-value" id="words-stat">0</span>
                <span class="stat-label">Words</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="chars-inc-spaces-stat">0</span>
                <span class="stat-label">Characters (incl. spaces)</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="chars-exc-spaces-stat">0</span>
                <span class="stat-label">Characters (excl. spaces)</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="sentences-stat">0</span>
                <span class="stat-label">Sentences</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="lines-stat">0</span>
                <span class="stat-label">Lines</span>
            </div>
            <div class="stat-item" id="reading-time-item">
                <span class="stat-value" id="reading-time-stat">&lt; 1 min read</span>
                <span class="stat-label">Reading Time</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="flesch-stat">N/A</span>
                <span class="stat-label">Flesch Reading Ease</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="grade-level-stat">N/A</span>
                <span class="stat-label">Grade Level</span>
            </div>
        </section>

        <div class="action-buttons">
            <button id="copy-stats">Copy Stats</button>
            <button id="download-stats">Download Stats</button>
            <button id="share-stats">Share Stats</button>
            <button id="clear-text">Clear Text</button>
        </div>

        <section id="frequency-section" class="frequency-section" style="display: none;">
            <h2>Top 10 Words</h2>
            <ol id="frequency-list"></ol>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Element References ---
            const textInput = document.getElementById('text-input');

            const smartModeRadio = document.getElementById('smart-mode');
            const strictModeRadio = document.getElementById('strict-mode');

            const countNumbersCheckbox = document.getElementById('count-numbers');
            const hyphenatedWordsCheckbox = document.getElementById('hyphenated-words');
            const showReadingTimeCheckbox = document.getElementById('show-reading-time');
            const darkModeToggle = document.getElementById('dark-mode-toggle');

            const wordsStat = document.getElementById('words-stat');
            const charsIncSpacesStat = document.getElementById('chars-inc-spaces-stat');
            const charsExcSpacesStat = document.getElementById('chars-exc-spaces-stat');
            const sentencesStat = document.getElementById('sentences-stat');
            const linesStat = document.getElementById('lines-stat');
            const readingTimeStat = document.getElementById('reading-time-stat');
            const readingTimeItem = document.getElementById('reading-time-item');
            const fleschStat = document.getElementById('flesch-stat');
            const gradeLevelStat = document.getElementById('grade-level-stat');

            const frequencySection = document.getElementById('frequency-section');
            const frequencyList = document.getElementById('frequency-list');
            const copyStatsBtn = document.getElementById('copy-stats');
            const downloadStatsBtn = document.getElementById('download-stats');
            const shareStatsBtn = document.getElementById('share-stats');
            const clearTextBtn = document.getElementById('clear-text');

            // --- Constants ---
            const WPM = 200;
            const CONFIG_KEY = 'settings';
            let lastFrequency = [];

            // --- Main Update Function ---
            const updateAllStats = () => {
                const rawText = textInput.value;

                // 1. Normalization
                const normalizedText = normalizeText(rawText);

                // 2. Configuration
                const config = {
                    mode: smartModeRadio.checked ? 'smart' : 'strict',
                    countNumbers: countNumbersCheckbox.checked,
                    hyphenatedAsOne: hyphenatedWordsCheckbox.checked,
                    showReadingTime: showReadingTimeCheckbox.checked
                };

                // 3. Calculations
                const words = countWords(normalizedText, config);
                const wordCount = words.length;
                const charCountIncSpaces = normalizedText.length;
                const charCountExcSpaces = (normalizedText.match(/[^\s]/g) || []).length;
                const sentenceCount = countSentences(normalizedText);
                const lineCount = (normalizedText.match(/\n/g) || []).length + (normalizedText.length > 0 ? 1 : 0);
                const readingTime = calculateReadingTime(wordCount);
                const syllableCount = words.reduce((sum, w) => sum + countSyllables(w), 0);
                const readingEase = (sentenceCount > 0 && wordCount > 0)
                    ? calculateFleschReadingEase(wordCount, sentenceCount, syllableCount)
                    : 'N/A';
                const gradeLevel = (sentenceCount > 0 && wordCount > 0)
                    ? calculateFleschKincaidGrade(wordCount, sentenceCount, syllableCount)
                    : 'N/A';
                const wordFrequency = getWordFrequency(words);
                lastFrequency = wordFrequency;

                // 4. UI Updates
                wordsStat.textContent = wordCount;
                charsIncSpacesStat.textContent = charCountIncSpaces;
                charsExcSpacesStat.textContent = charCountExcSpaces;
                sentencesStat.textContent = sentenceCount;
                linesStat.textContent = lineCount;

                readingTimeItem.style.display = config.showReadingTime ? 'block' : 'none';
                readingTimeStat.textContent = readingTime;
                fleschStat.textContent = readingEase;
                gradeLevelStat.textContent = gradeLevel;

                updateFrequencyList(wordFrequency);
            };

            // --- Helper Functions ---

            const handleInput = () => {
                localStorage.setItem('textInput', textInput.value);
                updateAllStats();
            };

            function applyTheme(theme) {
                document.body.classList.toggle('dark-mode', theme === 'dark');
            }

            function getStatsText() {
                const stats = [
                    `Words: ${wordsStat.textContent}`,
                    `Characters (incl. spaces): ${charsIncSpacesStat.textContent}`,
                    `Characters (excl. spaces): ${charsExcSpacesStat.textContent}`,
                    `Sentences: ${sentencesStat.textContent}`,
                    `Lines: ${linesStat.textContent}`,
                    `Flesch Reading Ease: ${fleschStat.textContent}`,
                    `Grade Level: ${gradeLevelStat.textContent}`
                ];
                if (readingTimeItem.style.display !== 'none') {
                    stats.push(`Reading Time: ${readingTimeStat.textContent}`);
                }
                return stats.join('\n');
            }

            function saveConfig() {
                const config = {
                    mode: smartModeRadio.checked ? 'smart' : 'strict',
                    countNumbers: countNumbersCheckbox.checked,
                    hyphenatedAsOne: hyphenatedWordsCheckbox.checked,
                    showReadingTime: showReadingTimeCheckbox.checked,
                    theme: darkModeToggle.checked ? 'dark' : 'light'
                };
                localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
            }

            function loadConfig() {
                const saved = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}');
                if (saved.mode === 'strict') {
                    strictModeRadio.checked = true;
                } else if (saved.mode === 'smart') {
                    smartModeRadio.checked = true;
                }
                if (typeof saved.countNumbers === 'boolean') countNumbersCheckbox.checked = saved.countNumbers;
                if (typeof saved.hyphenatedAsOne === 'boolean') hyphenatedWordsCheckbox.checked = saved.hyphenatedAsOne;
                if (typeof saved.showReadingTime === 'boolean') showReadingTimeCheckbox.checked = saved.showReadingTime;
                if (saved.theme) {
                    darkModeToggle.checked = saved.theme === 'dark';
                    applyTheme(saved.theme);
                } else {
                    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    darkModeToggle.checked = prefersDark;
                    applyTheme(prefersDark ? 'dark' : 'light');
                }
            }

            function normalizeText(text) {
                return text
                    .replace(/\r\n/g, '\n') // CRLF to LF
                    .replace(/\u00A0/g, ' ') // Non-breaking space to standard space
                    .replace(/[\u200B-\u200D\uFEFF]/g, ''); // Strip zero-width characters
            }

            function countWords(text, config) {
                if (text.trim() === '') return [];

                let segments;

                if (config.mode === 'smart') {
                    // Smart Mode Logic
                    if (typeof Intl.Segmenter === 'function') {
                        const segmenter = new Intl.Segmenter(undefined, { granularity: 'word' });
                        segments = Array.from(segmenter.segment(text))
                                        .filter(s => s.isWordLike)
                                        .map(s => s.segment);
                    } else {
                        // Fallback Regex for Smart Mode
                        const regex = config.hyphenatedAsOne
                            ? /[\p{L}\p{N}]+(?:-[\p{L}\p{N}]+)*/gu
                            : /[\p{L}\p{N}]+/gu;
                        segments = text.match(regex) || [];
                    }
                } else {
                    // Strict Mode Logic
                    segments = text.split(/\s+/).filter(Boolean);
                }

                // Post-processing based on configuration
                let filteredWords = segments;

                if (!config.countNumbers) {
                    filteredWords = filteredWords.filter(word => !/^\d+$/.test(word));
                }

                // Emojis are never counted as words in Smart Mode
                if (config.mode === 'smart') {
                     const emojiRegex = /\p{Emoji}/u;
                     filteredWords = filteredWords.filter(word => !emojiRegex.test(word));
                }

                // Handle hyphenated words in smart mode when Intl.Segmenter is used
                // as it splits them by default.
                if (config.mode === 'smart' && config.hyphenatedAsOne && typeof Intl.Segmenter === 'function') {
                    const hyphenatedRegex = /[\p{L}\p{N}]+(?:-[\p{L}\p{N}]+)+/gu;
                    const hyphenatedTerms = text.match(hyphenatedRegex) || [];
                    if (hyphenatedTerms.length > 0) {
                        const wordSet = new Set(filteredWords);
                        hyphenatedTerms.forEach(term => {
                            const parts = term.split('-');
                            if (parts.every(p => wordSet.has(p))) {
                                parts.forEach(p => wordSet.delete(p));
                                wordSet.add(term);
                            }
                        });
                        filteredWords = Array.from(wordSet);
                    }
                }


                return filteredWords;
            }

            function countSentences(text) {
                if (text.trim() === '') return 0;
                // Matches sentence-ending punctuation, including CJK equivalents.
                const sentenceEndRegex = /[.!?…。」！？]/g;
                const matches = text.match(sentenceEndRegex);
                return matches ? matches.length : (text.length > 0 ? 1 : 0);
            }

            function calculateReadingTime(wordCount) {
                if (wordCount === 0) return '< 1 min read';
                const minutes = Math.ceil(wordCount / WPM);
                return minutes === 1 ? '1 min read' : `${minutes} min read`;
            }

            function getWordFrequency(words) {
                const frequency = new Map();
                words.forEach(word => {
                    const lowerWord = word.toLowerCase();
                    frequency.set(lowerWord, (frequency.get(lowerWord) || 0) + 1);
                });

                return Array.from(frequency.entries())
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 10);
            }

            function countSyllables(word) {
                const cleaned = word.toLowerCase().replace(/[^a-z]/g, '');
                if (!cleaned) return 0;
                const syllables = cleaned
                    .replace(/e$/i, '')
                    .match(/[aeiouy]+/g);
                return syllables ? syllables.length : 1;
            }

            function calculateFleschReadingEase(words, sentences, syllables) {
                return (206.835 - 1.015 * (words / sentences) - 84.6 * (syllables / words)).toFixed(1);
            }

            function calculateFleschKincaidGrade(words, sentences, syllables) {
                return (0.39 * (words / sentences) + 11.8 * (syllables / words) - 15.59).toFixed(1);
            }

            function updateFrequencyList(frequencyData) {
                if (frequencyData.length > 0) {
                    frequencySection.style.display = 'block';
                    frequencyList.innerHTML = '';
                    frequencyData.forEach(([word, count]) => {
                        const li = document.createElement('li');
                        li.textContent = `${word} (${count})`;
                        frequencyList.appendChild(li);
                    });
                } else {
                    frequencySection.style.display = 'none';
                }
            }

            // --- Event Listeners ---
            const savedText = localStorage.getItem('textInput');
            if (savedText) {
                textInput.value = savedText;
            }

            loadConfig();

            textInput.addEventListener('input', handleInput);
            textInput.addEventListener('paste', () => setTimeout(handleInput, 0));
            [smartModeRadio, strictModeRadio, countNumbersCheckbox, hyphenatedWordsCheckbox, showReadingTimeCheckbox].forEach(el => {
                el.addEventListener('change', () => {
                    saveConfig();
                    updateAllStats();
                });
            });

            darkModeToggle.addEventListener('change', () => {
                applyTheme(darkModeToggle.checked ? 'dark' : 'light');
                saveConfig();
            });

            copyStatsBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(getStatsText()).then(() => {
                    copyStatsBtn.textContent = 'Copied!';
                    setTimeout(() => (copyStatsBtn.textContent = 'Copy Stats'), 1500);
                });
            });

            downloadStatsBtn.addEventListener('click', () => {
                    const stats = {
                        words: parseInt(wordsStat.textContent, 10),
                        charactersInclSpaces: parseInt(charsIncSpacesStat.textContent, 10),
                        charactersExclSpaces: parseInt(charsExcSpacesStat.textContent, 10),
                        sentences: parseInt(sentencesStat.textContent, 10),
                        lines: parseInt(linesStat.textContent, 10),
                        fleschReadingEase: fleschStat.textContent,
                        gradeLevel: gradeLevelStat.textContent,
                        topWords: lastFrequency.map(([word, count]) => ({ word, count }))
                    };
                    if (readingTimeItem.style.display !== 'none') {
                        stats.readingTime = readingTimeStat.textContent;
                    }
                const blob = new Blob([JSON.stringify(stats, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'word-stats.json';
                a.click();
                URL.revokeObjectURL(url);
            });

            shareStatsBtn.addEventListener('click', async () => {
                const text = getStatsText();
                if (navigator.share) {
                    try {
                        await navigator.share({ text });
                    } catch (err) {
                        console.error('Share failed:', err);
                    }
                } else {
                    await navigator.clipboard.writeText(text);
                    shareStatsBtn.textContent = 'Copied!';
                    setTimeout(() => (shareStatsBtn.textContent = 'Share Stats'), 1500);
                }
            });

            clearTextBtn.addEventListener('click', () => {
                textInput.value = '';
                localStorage.removeItem('textInput');
                updateAllStats();
                textInput.focus();
            });

            // --- Initial Calculation ---
            updateAllStats();

            // --- PWA Service Worker Registration ---
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/service-worker.js')
                        .then(registration => {
                            console.log('ServiceWorker registration successful with scope: ', registration.scope);
                        })
                        .catch(error => {
                            console.log('ServiceWorker registration failed: ', error);
                        });
                });
            }
        });
    </script>
</body>
</html>
